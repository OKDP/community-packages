{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hop.credentialsSecret" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  username: {{ include "hop.username" . | quote }}
  password: {{ include "hop.password" . | quote }}
{{- end }}
{{- if and .Values.web.enabled (not .Values.oidc.enabled) }}
{{- $password := include "hop.password" . }}
{{- if not $password }}
{{- fail (printf "Secret %s not found, or without a password key: the Hop Web basic auth is built from it" (include "hop.credentialsSecret" .)) }}
{{- end }}
---
# nginx basic auth in front of Hop Web, which has no login of its own.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hop.name" . }}-web-auth
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  auth: {{ htpasswd (include "hop.username" .) $password | quote }}
{{- end }}
{{- if and .Values.web.enabled .Values.oidc.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hop.name" . }}-oauth2-proxy
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  cookie-secret: {{ include "hop.cookieSecret" . | quote }}
{{- end }}
