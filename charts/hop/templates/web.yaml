{{- if .Values.web.enabled }}
{{- $name := printf "%s-web" (include "hop.name" .) }}
{{- $oidc := .Values.oidc }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.web.persistence.className }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.web.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hop-web
    app.kubernetes.io/instance: {{ include "hop.name" . }}
spec:
  # Hop Web keeps each user session in memory, and /data is ReadWriteOnce.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hop-web
      app.kubernetes.io/instance: {{ include "hop.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hop-web
        app.kubernetes.io/instance: {{ include "hop.name" . }}
      annotations:
        checksum/init: {{ include (print $.Template.BasePath "/web-init.yaml") . | sha256sum | trunc 16 }}
        {{- if .Values.server.enabled }}
        # The init container copies the server credentials into the project metadata.
        checksum/credentials: {{ printf "%s|%s" (include "hop.username" .) (include "hop.password" .) | sha256sum | trunc 16 }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 501
        runAsGroup: 501
        fsGroup: 501
      initContainers:
        - name: init
          image: {{ .Values.web.image }}
          command: ["/bin/bash", "/init/init.sh"]
          {{- if .Values.server.enabled }}
          env:
            - name: HOP_SERVER_USER
              valueFrom:
                secretKeyRef: { name: {{ include "hop.credentialsSecret" . }}, key: username }
            - name: HOP_SERVER_PASS
              valueFrom:
                secretKeyRef: { name: {{ include "hop.credentialsSecret" . }}, key: password }
          {{- end }}
          volumeMounts:
            - { name: init, mountPath: /init }
            - { name: data, mountPath: /data }
      containers:
        - name: hop-web
          image: {{ .Values.web.image }}
          env:
            - { name: HOP_CONFIG_FOLDER, value: /data/config }
            - { name: HOP_AUDIT_FOLDER, value: /data/audit }
            - { name: HOP_OPTIONS, value: {{ .Values.web.javaOptions | quote }} }
          ports:
            - { name: http, containerPort: 8080 }
          # /ui opens a UI session on every call: probe the socket.
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 90
            periodSeconds: 20
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: /data }
        {{- if $oidc.enabled }}
        - name: oauth2-proxy
          image: {{ $oidc.proxy.image }}
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:8080/
            - --provider=oidc
            - --oidc-issuer-url={{ required "oidc.issuerUri is required" $oidc.issuerUri }}
            - --redirect-url=https://{{ .Values.web.ingress.host }}/oauth2/callback
            - --scope={{ $oidc.scope }}
            {{- if $oidc.usePKCE }}
            - --code-challenge-method=S256
            {{- end }}
            - --provider-ca-file=/cacerts/ca.crt
            - --email-domain=*
            # Keycloak leaves email_verified false for users created without a check.
            - --insecure-oidc-allow-unverified-email=true
            - --oidc-groups-claim={{ $oidc.rolesClaim }}
            {{- range $oidc.allowedRoles }}
            - --allowed-group={{ . }}
            {{- end }}
            - --cookie-name=_{{ include "hop.name" . }}_oauth2
            - --cookie-secure=true
            - --cookie-expire=8h
            - --skip-provider-button=true
            - --reverse-proxy=true
            # Hop Web holds a request open to push UI updates.
            - --upstream-timeout=1h
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: {{ required "oidc.clientSecret is required" $oidc.clientSecret }}, key: client_id }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $oidc.clientSecret }}, key: client_secret }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "hop.name" . }}-oauth2-proxy, key: cookie-secret }
          ports:
            - { name: proxy, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ping, port: proxy }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: proxy }
            periodSeconds: 20
          {{- with $oidc.proxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: cacerts, mountPath: /cacerts, readOnly: true }
        {{- end }}
      volumes:
        - name: init
          configMap:
            name: {{ $name }}-init
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        {{- if $oidc.enabled }}
        - name: cacerts
          secret:
            secretName: {{ $oidc.caSecret }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: hop-web
    app.kubernetes.io/instance: {{ include "hop.name" . }}
  ports:
    # With OIDC, only the proxy is reachable: Hop Web has no login of its own.
    - { name: http, port: 8080, targetPort: {{ ternary "proxy" "http" $oidc.enabled }} }
{{- with .Values.web.ingress.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    {{- with $.Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    # File uploads, and the long-held requests Hop Web pushes UI updates on.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    {{- if $oidc.enabled }}
    # The provider's tokens make the session cookies larger than the default buffer.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    {{- else }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ include "hop.name" $ }}-web-auth
    nginx.ingress.kubernetes.io/auth-realm: "Apache Hop"
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  rules:
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
  tls:
    - hosts:
        - {{ . }}
      secretName: {{ $name }}-tls
{{- end }}
{{- end }}
