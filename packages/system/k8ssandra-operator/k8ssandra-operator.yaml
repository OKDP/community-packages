# Installed once per platform: it owns cluster-wide CRDs, so a second Release
# would fight the first over them. Cassandra clusters are deployed per project
# with the k8ssandra package.
apiVersion: v1alpha1
name: k8ssandra-operator
tag: 1.33.0-1.0.0
protected: false
description: |
  K8ssandra operator — provisions and manages Apache Cassandra® clusters on Kubernetes.
  Bundles cass-operator. Watches every namespace, so one instance serves all projects.
usage:
  text: |
    K8ssandra operator, watching K8ssandraCluster resources in every namespace.
    Deploy a Cassandra cluster in a project with the k8ssandra package.

schema:
  parameters:
    properties:
      cpu:
        type: number
        default: 0.25
        multipleOf: 0.25
        description: "CPU request of each operator pod (k8ssandra-operator and cass-operator, vCPU). The limit is set to twice this value."
      memoryGi:
        type: number
        default: 0.5
        multipleOf: 0.25
        description: "Memory allocated to each operator pod (GiB). The chart ships with no cap at all by default."

modules:
  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://helm.k8ssandra.io/stable
        chart: k8ssandra-operator
        version: 1.33.0
    values: |
      {{- $resources := dict
          "requests" (dict "cpu" (printf "%v" .Parameters.cpu) "memory" (printf "%vGi" .Parameters.memoryGi))
          "limits"   (dict "cpu" (printf "%v" (mulf (float64 .Parameters.cpu) 2)) "memory" (printf "%vGi" .Parameters.memoryGi)) -}}
      global:
        # Watch every namespace: the clusters live in the projects, not here.
        clusterScoped: true

      resources:
        {{- toYaml $resources | nindent 8 }}

      cass-operator:
        resources:
          {{- toYaml $resources | nindent 10 }}

roles:
  - cassandra-operator
# cass-operator's admission webhooks refuse to render without cert-manager.
dependencies:
  - certManager
