# Installed once per platform: it owns cluster-wide CRDs, so a second Release
# would fight the first over them. Kafka clusters are deployed per project
# with the strimzi package.
apiVersion: v1alpha1
name: strimzi-operator
tag: 1.2.0-1.0.0
protected: false
description: |
  Strimzi operator — provisions and manages Apache Kafka® clusters on Kubernetes, with their topics and users.
  Watches every namespace, so one instance serves all projects.
usage:
  text: |
    Strimzi operator, watching Kafka resources in every namespace.
    Deploy a Kafka cluster in a project with the strimzi package.

schema:
  parameters:
    properties:
      cpu: { title: "Operator | CPU request (vCPU) | | order:1 columns:2", type: number, default: 0.25, multipleOf: 0.25, description: "CPU request of the cluster operator. The limit is set to twice this value." }
      memoryGi: { title: "Operator | Memory (GiB) | | order:2 columns:2", type: number, default: 0.5, multipleOf: 0.25, description: "Memory allocated to the cluster operator (GiB)" }

modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/strimzi-helm/strimzi-kafka-operator
        tag: 1.2.0
    # Helm installs the chart's crds/ once and never touches them again: have
    # Flux replace them on upgrade too, new operator versions need new fields.
    specPatch:
      install:
        crds: CreateReplace
      upgrade:
        crds: CreateReplace
    values: |
      # Watch every namespace: the clusters live in the projects, not here.
      watchAnyNamespace: true

      resources:
        requests:
          cpu: "{{ .Parameters.cpu }}"
          memory: "{{ .Parameters.memoryGi }}Gi"
        limits:
          cpu: "{{ mulf (float64 .Parameters.cpu) 2 }}"
          memory: "{{ .Parameters.memoryGi }}Gi"

roles:
  - kafka-operator
